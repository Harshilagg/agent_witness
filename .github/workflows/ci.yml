name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # actions/checkout and actions/setup-go are GitHub's own first-party
      # actions, not third-party marketplace code. Everything else this
      # workflow does is a direct go/shell command, per the project's
      # zero-third-party-dependency stance extending to its own CI.
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

      - name: Build
        run: go build ./...
